<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Student Registration</h1>
    <p class="sub">Fields marked * are mandatory</p>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" placeholder="Enter your full name" />
        <span class="error" id="nameError"></span>
      </div>

      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" placeholder="name@example.com" />
        <span class="error" id="emailError"></span>
      </div>

      <div class="field">
        <label for="mobile">Mobile Number *</label>
        <input type="text" id="mobile" placeholder="10 digit mobile number" maxlength="10" />
        <span class="error" id="mobileError"></span>
      </div>

      <div class="field">
        <label for="branch">Branch *</label>
        <select id="branch">
          <option value="">Select your branch</option>
          <option>Computer Science and Engineering</option>
          <option>Information Technology</option>
          <option>Electronics and Telecommunication</option>
          <option>Mechanical Engineering</option>
          <option>Civil Engineering</option>
        </select>
        <span class="error" id="branchError"></span>
      </div>

      <div class="field">
        <label for="password">Password *</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" />
        <span class="error" id="passwordError"></span>
      </div>

      <button type="submit">Register</button>
    </form>

    <div id="success" class="success hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
